<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="A simple, phone-friendly room escape game.">
  <title>The Last Room — Escape Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="start-screen" id="start-screen" aria-label="Start game">
      <div class="start-action">
        <svg class="start-art" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="start-halo" cx="120" cy="120" r="106"/>
          <circle class="start-orbit start-orbit-one" cx="120" cy="120" r="82"/>
          <circle class="start-orbit start-orbit-two" cx="120" cy="120" r="64"/>
          <circle class="start-ripple ripple-one" cx="120" cy="120" r="52"/>
          <circle class="start-ripple ripple-two" cx="120" cy="120" r="52"/>
          <circle class="start-ripple ripple-three" cx="120" cy="120" r="52"/>
          <path class="start-rays" d="M120 17v13M120 210v13M17 120h13M210 120h13M47 47l9 9M184 184l9 9M193 47l-9 9M56 184l-9 9"/>
          <circle class="start-spark spark-one" cx="42" cy="85" r="2"/><circle class="start-spark spark-two" cx="190" cy="59" r="2.5"/><circle class="start-spark spark-three" cx="180" cy="171" r="1.7"/><circle class="start-spark spark-four" cx="56" cy="183" r="1.5"/>
        </svg>
        <button class="start-button" id="start-button" type="button">START</button>
      </div>
    </section>

    <div class="game-screen" id="game-screen" hidden>
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Game home"><span class="brand-mark" id="brand-fallback">L</span><img class="brand-logo" id="brand-logo" alt=""><span id="brand-name">THE LAST ROOM</span></a>
        <div class="live-label"><span class="live-status"><i></i> GAME IN PROGRESS</span><span class="timer" id="timer" aria-label="Elapsed time">00:00</span></div>
      </header>

      <section class="intro" id="top">
        <h1 id="hero-title">Find your way<br><em>out.</em></h1>
        <p class="intro-copy">Enter your answer to unlock the next act.</p>
        <div class="progress-wrap" aria-label="Game progress">
          <div class="progress-meta"><span id="progress-label">ACT 1 OF 6</span><span id="progress-count">0 / 6 SOLVED</span></div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
      </section>

      <section class="acts" id="acts" aria-label="Game acts"></section>
      <div class="scene-art" id="scene-art">
        <img id="act-art" alt="">
        <button class="hint-button" id="hint-button" type="button" aria-label="Show a hint">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4m-7-9a5 5 0 1 1 10 0c0 1.7-.8 2.8-1.8 3.7-.7.6-1.2 1.3-1.2 2.3h-4c0-1-.5-1.7-1.2-2.3C7.8 14.8 7 13.7 7 12Z"/></svg>
          <span>HINT</span>
        </button>
      </div>
      <dialog class="hint-dialog" id="hint-dialog" aria-labelledby="hint-title">
        <h2 id="hint-title">Need a nudge?</h2>
        <p class="hint-copy" id="hint-copy" hidden></p>
        <div class="hint-actions">
          <button type="button" class="hint-confirm" id="reveal-hint">REVEAL HINT</button>
          <button type="button" class="hint-cancel" id="close-hint">MAYBE LATER</button>
        </div>
      </dialog>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
